services:
  db:
    image: postgres:19.0-alpine3.24
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: espetinho
    ports:
      - "5433:5432"
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d espetinho"]
      interval: 3s
      timeout: 3s
      retries: 20

  node:
    image: node:26.13.1-trixie-slim
    working_dir: /app
    # Node 25+ não traz mais o corepack: instala se faltar e ativa o pnpm do packageManager
    entrypoint: ["sh", "-c", "command -v corepack >/dev/null 2>&1 || npm install -g --silent corepack; corepack enable && exec \"$$@\"", "--"]
    command: ["pnpm", "dev", "-H", "0.0.0.0"]
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/espetinho
      DATABASE_URL_TEST: postgres://postgres:dev@db:5432/espetinho_test
      APP_SENHA: dev
      SESSION_SECRET: dev-session-secret-com-mais-de-32-caracteres
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm
    depends_on:
      db:
        condition: service_healthy

volumes:
  node_modules:
  pnpm_store:
